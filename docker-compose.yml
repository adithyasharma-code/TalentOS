services:
  postgres:
    image: postgres:17
    container_name: talentos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentos
      POSTGRES_USER: talentos
      POSTGRES_PASSWORD: talentos_dev
    ports:
      - "5432:5432"
    volumes:
      - talentos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos -d talentos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  talentos_postgres_data: